name: Runtime Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: multi-bot-24-7-single-instance
  cancel-in-progress: false

jobs:
  run-aux-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out runner helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify state backup helpers
        run: python -m unittest discover -s tests -v

      - name: Start Runtime Service
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PYTHONUTF8: "1"
          QUIET_STARTUP: "1"
        run: |
          git config --global user.name "ShopBot AutoSave"
          git config --global user.email "bot@users.noreply.github.com"

          git clone https://x-access-token:${PAT_TOKEN}@github.com/alexandratodika/kho9-tele-shop-bot.git bot9
          git clone https://x-access-token:${PAT_TOKEN}@github.com/alexandratodika/unghosinhvien-tele-bot.git bot10

          pip install --upgrade pip
          pip install -r bot9/requirements.txt -r bot10/requirements.txt

          cp -a "bot9" "$RUNNER_TEMP/bot9_state_sync"
          cp -a "bot10" "$RUNNER_TEMP/bot10_state_sync"

          save_all_bot_states() {
            local failed=0
            for d in bot9 bot10; do
              if ! python "$GITHUB_WORKSPACE/runtime_state.py" "$d" "$RUNNER_TEMP/${d}_state_sync" 'shop_data.db' 'ungho_data.db' 'skyworld_cache.json' 'domdalton_cache.json'; then
                failed=1
              fi
            done
            return "$failed"
          }

          (
            while true; do
              sleep 180
              if ! save_all_bot_states; then
                echo "::warning::Periodic state save failed; next cycle will retry."
              fi
            done
          ) &
          AUTOSAVE_PID=$!

          (
            while true; do
              for d in bot9 bot10; do
                (
                  cd "$d"
                  git fetch origin main 2>/dev/null || true
                  git checkout origin/main -- hub_tunnel.json 2>/dev/null || true
                )
              done
              if ! grep -qE '^BOT_TOKEN=.+$' bot10/.env 2>/dev/null; then
                (cd bot10 && git checkout origin/main -- .env 2>/dev/null || true)
              fi
              sleep 45
            done
          ) &
          HOTSYNC_PID=$!

          

          sleep 2

          for d in bot9 bot10; do
            (
              cd "$d"
              START_TIME=$SECONDS
              while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
                REMAINING=$((19500 - (SECONDS - START_TIME)))
                if [ $REMAINING -le 0 ]; then break; fi
                timeout --signal=SIGINT --kill-after=30s ${REMAINING}s python -X utf8 bot.py >>/tmp/runtime.log 2>&1 || true
                sleep 3
              done
            ) &
          done

          sleep 19508

          kill "$AUTOSAVE_PID" "$HOTSYNC_PID" 2>/dev/null || true
          wait "$AUTOSAVE_PID" 2>/dev/null || true

          if ! save_all_bot_states; then
            echo "::warning::End-of-run state save failed; finalizer will retry."
          fi

          curl -s -X POST \
            -H "Authorization: token ${PAT_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/alexandratodika/tele-shop-cloud-runner/actions/workflows/run-24-7.yml/dispatches \
            -d '{"ref":"main"}' || true

      - name: Save validated state on exit or cancel
        if: always()
        run: |
          pkill -INT -f "python -X utf8" 2>/dev/null || true
          sleep 3
          failed=0
          for d in bot9 bot10; do
            if [ -d "$d/.git" ]; then
              if [ ! -d "$RUNNER_TEMP/${d}_state_sync/.git" ]; then
                echo "::error::Independent state checkout is missing."
                failed=1
                continue
              fi
              if ! python "$GITHUB_WORKSPACE/runtime_state.py" "$d" "$RUNNER_TEMP/${d}_state_sync" 'shop_data.db' 'ungho_data.db' 'skyworld_cache.json' 'domdalton_cache.json'; then
                failed=1
              fi
            fi
          done
          exit "$failed"
