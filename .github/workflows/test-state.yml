name: Validate state backups

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'runtime_state.py'
      - 'checkout_sources.py'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  state-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
